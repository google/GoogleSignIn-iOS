name: GSI Chatroom PR Notification

on:
  pull_request:
    types: [review_requested]

jobs:
  notify-pull-request:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Request Details
      run: |
        echo "Pull Request: ${{ github.event.pull_request.number }}"
        echo "Author: ${GITHUB_EVENT_PULL_REQUEST_USER_LOGIN}"
      env:
        GITHUB_EVENT_PULL_REQUEST_USER_LOGIN: ${{ github.event.pull_request.user.login }}

    - name: Google Chat Notification
      shell: bash
      env:
        # All untrusted values are passed via env vars and encoded with jq
        # to prevent shell injection and JSON injection attacks.
        TITLE: ${{ github.event.pull_request.title }}
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        REPO: ${{ github.event.pull_request.head.repo.full_name }}
        CREATOR: ${{ github.event.pull_request.user.login }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_STATE: ${{ github.event.pull_request.state }}
        ASSIGNEES: ${{ join(github.event.pull_request.assignees.*.login, ', ') }}
        REVIEWERS: ${{ join(github.event.pull_request.requested_reviewers.*.login, ', ') }}
      run: |
        # Build JSON safely with jq to handle special characters in PR title/labels
        PAYLOAD=$(jq -n \
          --arg title    "$TITLE" \
          --arg labels   "$LABELS" \
          --arg repo     "$REPO" \
          --arg creator  "$CREATOR" \
          --arg url      "$PR_URL" \
          --arg prnum    "$PR_NUMBER" \
          --arg state    "$PR_STATE" \
          --arg assignees "$ASSIGNEES" \
          --arg reviewers "$REVIEWERS" \
          '{
            "cards": [{
              "header": {
                "title": "Pull request notification",
                "subtitle": ("Pull request: #" + $prnum)
              },
              "sections": [{
                "widgets": [
                  {"keyValue": {"topLabel": "Repo",      "content": $repo}},
                  {"keyValue": {"topLabel": "Title",     "content": $title}},
                  {"keyValue": {"topLabel": "Creator",   "content": $creator}},
                  {"keyValue": {"topLabel": "State",     "content": $state}},
                  {"keyValue": {"topLabel": "Assignees", "content": $assignees}},
                  {"keyValue": {"topLabel": "Reviewers", "content": $reviewers}},
                  {"keyValue": {"topLabel": "Labels",    "content": $labels}},
                  {"buttons": [{"textButton": {"text": "Open Pull Request",
                    "onClick": {"openLink": {"url": $url}}}}]}
                ]
              }]
            }]
          }')

        curl --location --request POST '${{ secrets.WEBHOOK_URL }}' \
          --header 'Content-Type: application/json' \
          --data-raw "$PAYLOAD"
